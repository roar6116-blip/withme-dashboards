name: Update HPB Trends (Daily)

# 毎日 JST 10:00 (= UTC 01:00) に実行 + 手動トリガーも可能
# 以前は毎週月曜のみ (cron: '0 1 * * 1') → 毎日に変更 (2026-08-14)
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund; fi

      - name: Fetch HPB review/blog post dates (5 stores)
        run: node scripts/fetch-hpb-trends.js

      - name: Rebuild reviews.json with new trends
        run: node scripts/build-reviews-json.js

      - name: Append history snapshot
        run: node scripts/append-history.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salon/data/reviews.json salon/data/reviews-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto(hpb-trends): daily HPB trend update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # 他のワークフロー(毎時Google更新)と同時実行すると push が競合しうるため
          # rebase失敗時は abort してリトライする（最大5回）
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
