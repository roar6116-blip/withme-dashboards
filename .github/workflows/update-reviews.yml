name: Update Review Dashboard

on:
  schedule:
    # 毎時0分に実行 (UTC) → JST毎時9分・19分・29分... ではなく毎時0分のまま
    - cron: '0 * * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund; fi

      - name: Fetch Google reviews (Places API)
        env:
          # GBP API は 2026-05 に申請したが却下されたため、Places API のみで運用
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-google-reviews.js
        continue-on-error: true

      - name: Fetch HPB data from Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REVIEW_MASTER_SHEET_ID: ${{ secrets.REVIEW_MASTER_SHEET_ID }}
        run: node scripts/fetch-hpb-data.js
        continue-on-error: true

      - name: Calculate scores and merge data
        run: node scripts/build-reviews-json.js

      - name: Append history if month changed
        run: node scripts/append-history.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salon/data/reviews.json salon/data/reviews-history.json salon/data/google-monthly-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: update review dashboard data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # 他のワークフロー(HPB更新等)と同時実行すると push が競合しうるため
          # rebase失敗時は abort してリトライする（最大5回）
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
